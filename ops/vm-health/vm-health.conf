# Configurazione di vm-health-check, installata in /etc/vm-health/vm-health.conf.
# L'installatore non sovrascrive questo file se esiste gia'.

# Un processo sopra CPU_PCT di un core per CPU_INTERVALS giri da 5 minuti.
CPU_PCT=80
CPU_INTERVALS=6

# Soglie di memoria, in MiB.
SWAP_MAX_MIB=1024
MEMAVAIL_MIN_MIB=200

# Minuti prima di ripetere lo stesso allarme.
REALERT_MIN=60

# Servizi di produzione da tenere attivi.
SYSTEM_SERVICES=nginx.service
USER_SERVICES=intrawelt:intrapanel.service
HTTP_URLS=http://127.0.0.1/

# Comando che riceve il testo dell'allarme sullo standard input. Vuoto finche'
# non c'e' un relay SMTP: gli allarmi restano nel journal (journalctl -t vm-health).
NOTIFY_CMD=
