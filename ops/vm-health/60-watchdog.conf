# Installato in /etc/systemd/system.conf.d/60-watchdog.conf.
# systemd azzera il watchdog hardware ogni 15 secondi; se il sistema si blocca
# per 30 secondi il dispositivo virtuale i6300esb fa resettare la VM a Proxmox.
# Senza il dispositivo (qm set <vmid> --watchdog ...) systemd lo segnala e prosegue.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
