server {
    listen 8090;
    server_name convertitore-ruolini;

    allow 127.0.0.1;        # staging: provabile anche da dentro la VM (localhost)
    allow 192.168.10.73;
    allow 192.168.10.74;
    allow 192.168.10.75;
    deny all;

    # ambiente di STAGING: build del branch develop, pubblicata a parte
    root /var/www/convertitore-ruolini-test;
    index index.html;

    # solo le rotte applicative vanno al backend di staging su 5010
    location ~ ^/(get-login|trex|upload|save|download) {
        proxy_pass http://127.0.0.1:5010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # /save puo durare diversi minuti: stesso timeout della produzione
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
